<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>QQvirt WebApp</title>

    <!-- Telegram WebApp SDK -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>

    <style>
        body {
            background: #0d1117;
            color: #fff;
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
        }

        h1 {
            text-align: center;
            margin-top: 20px;
        }

        .btn {
            display: block;
            width: 100%;
            padding: 15px;
            background: #21262d;
            border-radius: 10px;
            text-align: center;
            margin-bottom: 15px;
            font-size: 18px;
            border: 1px solid #30363d;
        }

        .btn:hover {
            background: #30363d;
        }
    </style>
</head>
<body>

<h1>QQvirt — меню</h1>

<a class="btn" href="#">Каталог</a>
<a class="btn" href="#">Личный кабинет</a>
<a class="btn" href="#">FAQ</a>
<a class="btn" href="#">Помощь</a>

<script>
    // Инициализация WebApp
    const tg = window.Telegram.WebApp;
    tg.expand();
</script>

</body>
</html>
